name: Public Site Privacy Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test privacy guard rules
        run: python -m unittest discover -s tests -p "test_public_privacy.py" -v

      - name: Scan every tracked public file
        run: python scripts/check_public_privacy.py
